plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.avmtest'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.avmtest"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions "vehicle"
    productFlavors {
        c12 {
            dimension "vehicle"
            applicationId "com.example.avmtest.c12"
            buildConfigField "String", "PROFILE_ASSET", "\"profiles/c12.json\""
        }
        d15_tf {
            dimension "vehicle"
            applicationId "com.example.avmtest.d15tf"
            buildConfigField "String", "PROFILE_ASSET", "\"profiles/d15_tf.json\""
        }
        q12 {
            dimension "vehicle"
            applicationId "com.example.avmtest.q12"
            buildConfigField "String", "PROFILE_ASSET", "\"profiles/q12.json\""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
